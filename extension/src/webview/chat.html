<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src {{cspSource}} 'unsafe-inline'; script-src {{cspSource}} 'nonce-{{nonce}}'; img-src https: data:;"
    />
    <title>TS-Lint Service</title>
    <link rel="stylesheet" href="{{coreStyleUri}}" />
    <link rel="stylesheet" href="{{bubbleStyleUri}}" />
    <link rel="stylesheet" href="{{logStyleUri}}" />
    <link rel="stylesheet" href="{{gapStyleUri}}" />
  </head>
  <body data-display-mode="bubble">
    <div id="status-bar">
      <span id="status-indicator" class="status-connecting"></span>
      <span id="status-text">连接中...</span>
      <button id="settings-btn" title="设置">⚙</button>
    </div>

    <div id="messages-container">
      <div id="empty-state">暂无消息</div>
    </div>

    <div id="input-container">
      <div id="attachment-preview"></div>
      <div id="input-row">
        <textarea
          id="message-input"
          placeholder="输入消息... (可粘贴图片)"
          rows="1"
        ></textarea>
        <button id="send-button" title="发送 (Enter)">
          <span>发送</span>
        </button>
      </div>
    </div>

    <button id="scroll-to-bottom" title="滚动到底部">↓</button>

    <!-- Settings View (Overlay) -->
    <div id="settings-view" class="hidden">
      <div class="settings-header">
        <button id="settings-back-btn" title="返回">←</button>
        <span>设置</span>
      </div>
      <div class="settings-content">
        <section class="section">
          <h2 class="section-title">全局设置</h2>
          <div class="form-group">
            <label for="serverUrl">默认服务器</label>
            <input type="text" id="serverUrl" placeholder="http://localhost:3000" />
          </div>
          <div class="form-group">
            <label>传输方式</label>
            <div class="radio-group">
              <label class="radio-label">
                <input type="radio" name="transport" value="auto" />
                <span>自动</span>
              </label>
              <label class="radio-label">
                <input type="radio" name="transport" value="websocket" />
                <span>WebSocket</span>
              </label>
            </div>
          </div>
          <div class="form-group">
            <label class="checkbox-label">
              <input type="checkbox" id="autoReveal" />
              <span>自动显示</span>
            </label>
          </div>
          <div class="form-group">
            <label for="displayMode">显示模式</label>
            <select id="displayMode">
              <option value="bubble">气泡</option>
              <option value="log">日志</option>
            </select>
          </div>
          <button id="saveGlobalBtn" class="btn btn-primary">保存设置</button>
        </section>

        <section class="section">
          <h2 class="section-title">连接配置</h2>
          <div id="connectionList"></div>
          <button id="addConnectionBtn" class="btn btn-secondary">+ 添加连接配置</button>
        </section>
      </div>
    </div>

    <!-- Modal -->
    <div id="modal" class="modal hidden">
      <div class="modal-content">
        <h3 id="modalTitle">添加连接配置</h3>
        <div class="form-group">
          <label for="connName">名称</label>
          <input type="text" id="connName" placeholder="Production" />
        </div>
        <div class="form-group">
          <label for="connServerUrl">服务器地址 (可选)</label>
          <input type="text" id="connServerUrl" placeholder="使用全局默认" />
        </div>
        <div class="form-group">
          <label for="connToken">密钥</label>
          <input type="password" id="connToken" placeholder="输入密钥" />
        </div>
        <div class="modal-actions">
          <button id="modalCancelBtn" class="btn btn-secondary">取消</button>
          <button id="modalSaveBtn" class="btn btn-primary">保存</button>
        </div>
      </div>
    </div>

    <script nonce="{{nonce}}" src="{{utilsScriptUri}}"></script>
    <script nonce="{{nonce}}" src="{{rendererScriptUri}}"></script>
    <script nonce="{{nonce}}" src="{{settingsScriptUri}}"></script>
    <script nonce="{{nonce}}" src="{{scriptUri}}"></script>
  </body>
</html>
