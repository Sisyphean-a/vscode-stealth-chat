<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src {{cspSource}} 'unsafe-inline'; script-src {{cspSource}} 'nonce-{{nonce}}';"
    />
    <title>Rule Configuration</title>
    <link rel="stylesheet" href="{{styleUri}}" />
  </head>
  <body>
    <div class="container">
      <section class="section">
        <h2 class="section-title">Global Settings</h2>
        <div class="form-group">
          <label for="serverUrl">Default Server</label>
          <input type="text" id="serverUrl" placeholder="http://localhost:3000" />
        </div>
        <div class="form-group">
          <label>Transport</label>
          <div class="radio-group">
            <label class="radio-label">
              <input type="radio" name="transport" value="auto" />
              <span>Auto</span>
            </label>
            <label class="radio-label">
              <input type="radio" name="transport" value="websocket" />
              <span>WebSocket</span>
            </label>
          </div>
        </div>
        <div class="form-group">
          <label class="checkbox-label">
            <input type="checkbox" id="autoReveal" />
            <span>Auto Reveal</span>
          </label>
        </div>
        <div class="form-group">
          <label for="displayMode">Display</label>
          <select id="displayMode">
            <option value="bubble">Bubble</option>
            <option value="log">Log</option>
          </select>
        </div>
        <button id="saveGlobalBtn" class="btn btn-primary">Save Settings</button>
      </section>

      <section class="section">
        <h2 class="section-title">Rule Sets</h2>
        <div id="connectionList"></div>
        <button id="addConnectionBtn" class="btn btn-secondary">+ Add Rule Set</button>
      </section>
    </div>

    <!-- Modal -->
    <div id="modal" class="modal hidden">
      <div class="modal-content">
        <h3 id="modalTitle">Add Rule Set</h3>
        <div class="form-group">
          <label for="connName">Name</label>
          <input type="text" id="connName" placeholder="Production" />
        </div>
        <div class="form-group">
          <label for="connServerUrl">Server URL (optional)</label>
          <input type="text" id="connServerUrl" placeholder="Use global default" />
        </div>
        <div class="form-group">
          <label for="connToken">API Key</label>
          <input type="text" id="connToken" placeholder="Enter token" />
        </div>
        <div class="modal-actions">
          <button id="modalCancelBtn" class="btn btn-secondary">Cancel</button>
          <button id="modalSaveBtn" class="btn btn-primary">Save</button>
        </div>
      </div>
    </div>

    <script nonce="{{nonce}}" src="{{scriptUri}}"></script>
  </body>
</html>
