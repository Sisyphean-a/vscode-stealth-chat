<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src {{cspSource}} 'unsafe-inline'; script-src {{cspSource}} 'nonce-{{nonce}}'; img-src {{cspSource}} https: http: data:; connect-src {{cspSource}} https: http: ws: wss:;"
    />
    <title>{{appTitle}}</title>
    <link rel="stylesheet" href="{{styleUri}}" />
  </head>
  <body data-display-mode="bubble">
    <div id="app"></div>
    <script nonce="{{nonce}}" src="{{scriptUri}}"></script>
  </body>
</html>
