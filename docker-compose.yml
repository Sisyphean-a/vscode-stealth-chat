version: "3.8"

services:
  gotify:
    image: gotify/server
    container_name: gotify
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      GOTIFY_DEFAULTUSER_PASS: "${GOTIFY_PASS:-admin}"
    volumes:
      - ./gotify_data:/app/data

  chat-server:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: stealth-chat-server
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - GOTIFY_URL=http://gotify:80/message
      - GOTIFY_TOKEN=${GOTIFY_TOKEN}
      - GOTIFY_ADMIN_PASS=${GOTIFY_PASS:-admin}
      - STEALTH_SECRET=${STEALTH_SECRET:-ChangeMeInProduction}
      - CLICK_URL=${CLICK_URL:-https://chat.sisyphean.top}
      - DB_PATH=/app/data/messages.db
      - ARCHIVE_DB_PATH=/app/data/messages.archive.db
      - MESSAGE_RETENTION_DAYS=${MESSAGE_RETENTION_DAYS:-30}
      - MESSAGE_MAX_COUNT=${MESSAGE_MAX_COUNT:-1000}
      - APP_APPS=${APP_APPS}
    volumes:
      - ./server/data:/app/data
    depends_on:
      - gotify
