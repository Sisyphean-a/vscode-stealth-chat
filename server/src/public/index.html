<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Stealth Chat</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="//unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="/socket.io/socket.io.js"></script>
</head>
<body>
    <div id="app" v-cloak>
        <!-- Auth Screen -->
        <div v-if="!connected" id="auth-container">
            <div class="auth-box">
                <h1 class="auth-title">🔒 Stealth Chat</h1>
                <p class="auth-subtitle">输入密钥以连接</p>
                
                <input 
                    type="password" 
                    class="auth-input" 
                    v-model="authToken" 
                    placeholder="请输入密钥"
                    @keyup.enter="connect"
                    autocomplete="off"
                >
                
                <div class="auth-options">
                    <label class="remember-me">
                        <input type="checkbox" v-model="rememberMe">
                        <span>记住密钥</span>
                    </label>
                    <a v-if="hasSavedToken" class="clear-saved" @click="clearSavedToken">清除已保存</a>
                </div>

                <button class="auth-button" @click="connect">连接</button>
                
                <div v-if="errorMsg" class="auth-error" style="display: block">{{ errorMsg }}</div>
                
                <div class="auth-warning">
                    <strong>安全提示：</strong>切勿在公共设备上保存密钥，建议定期更换密钥。
                </div>
            </div>
        </div>

        <!-- Chat Screen -->
        <div v-else id="chat-container" style="display: flex">
            <div class="chat-header">
                <div class="chat-title">
                    <div class="status-indicator" :style="{ background: socketConnected ? 'var(--success-color)' : 'var(--text-secondary)' }"></div>
                    <h1>Stealth Chat</h1>
                </div>
                <div class="chat-info">
                    <div class="online-count">
                        <span class="online-dot"></span>
                        <span>{{ socketConnected ? '在线' : '离线' }}</span>
                    </div>
                    <button class="send-button" @click="disconnect" style="padding: 8px 16px; font-size: 13px;">断开</button>
                </div>
            </div>

            <div class="messages-wrapper" ref="messagesContainer">
                <ul id="messages">
                    <div v-if="messages.length === 0" class="empty-state">
                        <div class="empty-icon">💬</div>
                        <div class="empty-text">暂无消息</div>
                    </div>

                    <template v-for="(msg, index) in messages" :key="index">
                        <!-- Time Divider -->
                        <div v-if="showTimeDivider(msg, messages[index-1])" class="time-divider">
                            <span>{{ formatDividerDate(msg.timestamp) }}</span>
                        </div>

                        <!-- Message Item -->
                        <li :class="['message-item', msg.type]">
                            <div class="message-content">
                                <div class="message-bubble">
                                    <div v-if="msg.attachments" v-for="att in msg.attachments" :key="att.filename">
                                         <img 
                                            v-if="att.type === 'image'" 
                                            :src="getImageSrc(att)" 
                                            class="message-image" 
                                            @click="openImage(getImageSrc(att))"
                                         >
                                    </div>
                                    <div v-html="parseMarkdown(msg.text)"></div>
                                </div>
                                <div class="message-meta">
                                    <span v-if="msg.type !== 'own'" class="message-sender">{{ msg.sender }}</span>
                                    <span class="message-time">{{ formatTime(msg.timestamp) }}</span>
                                </div>
                            </div>
                        </li>
                    </template>
                </ul>
            </div>

            <div class="input-container">
                <form id="form" @submit.prevent="sendMessage">
                    <textarea
                        id="input"
                        v-model="inputText"
                        rows="1"
                        placeholder="输入消息..."
                        @keydown.enter.exact.prevent="sendMessage"
                        @input="autoResize"
                        ref="inputArea"
                    ></textarea>
                    <button type="submit" class="send-button" :disabled="!inputText.trim()">发送</button>
                </form>
            </div>
        </div>
    </div>

    <script>
        const { createApp, ref, reactive, computed, watch, nextTick, onMounted } = Vue;

        const app = createApp({
            setup() {
                const connected = ref(false);
                const socketConnected = ref(false);
                const authToken = ref('');
                const rememberMe = ref(false);
                const errorMsg = ref('');
                const hasSavedToken = ref(false);
                const messages = reactive([]);
                const inputText = ref('');
                const messagesContainer = ref(null);
                const inputArea = ref(null);
                let socket = null;

                // --- Auth Logic ---
                const loadSavedToken = () => {
                    const saved = localStorage.getItem('st_token');
                    if (saved) {
                        try {
                            authToken.value = atob(saved); // Simple decode
                            rememberMe.value = true;
                            hasSavedToken.value = true;
                        } catch(e) {}
                    }
                };

                const saveToken = () => {
                    if (rememberMe.value) {
                        localStorage.setItem('st_token', btoa(authToken.value));
                        hasSavedToken.value = true;
                    } else {
                        localStorage.removeItem('st_token');
                        hasSavedToken.value = false;
                    }
                };

                const clearSavedToken = () => {
                    localStorage.removeItem('st_token');
                    authToken.value = '';
                    rememberMe.value = false;
                    hasSavedToken.value = false;
                };

                const connect = () => {
                    if (!authToken.value) {
                        errorMsg.value = "请输入密钥";
                        return;
                    }
                    
                    // Init Socket
                    socket = io({
                        auth: { token: authToken.value }
                    });

                    socket.on('connect', () => {
                        connected.value = true;
                        socketConnected.value = true;
                        errorMsg.value = '';
                        saveToken();
                        socket.emit('load history', 50);
                        appendSystemMessage('已安全连接');
                    });

                    socket.on('connect_error', (err) => {
                        errorMsg.value = "连接失败: " + err.message;
                        socketConnected.value = false;
                    });

                    socket.on('disconnect', () => {
                        socketConnected.value = false;
                        appendSystemMessage('连接已断开');
                    });

                    socket.on('chat message', (msg) => {
                        appendMessage(msg);
                        scrollToBottom();
                    });
                    
                    socket.on('history loaded', (history) => {
                        if(history) {
                            history.forEach(appendMessage);
                            scrollToBottom();
                        }
                    });
                };

                const disconnect = () => {
                    if (socket) socket.disconnect();
                    connected.value = false;
                    messages.splice(0); // Clear messages
                };

                // --- Chat Logic ---
                const appendMessage = (msg) => {
                    // Normalize message structure
                    const type = msg.source === 'mobile' ? 'own' : (msg.source === 'system' ? 'system' : 'remote');
                    const sender = msg.source === 'mobile' ? 'Me' : 'VSCode';
                    messages.push({
                        text: msg.text,
                        type,
                        sender,
                        timestamp: msg.timestamp || Date.now(),
                        attachments: msg.attachments
                    });
                };

                const appendSystemMessage = (text) => {
                     messages.push({
                        text,
                        type: 'system',
                        sender: 'System',
                        timestamp: Date.now()
                    });
                };

                const sendMessage = () => {
                    if (!inputText.value.trim() || !socketConnected.value) return;
                    
                    socket.emit('chat message', {
                        text: inputText.value,
                        source: 'mobile'
                    });
                    
                    inputText.value = '';
                    nextTick(() => {
                        if(inputArea.value) {
                            inputArea.value.style.height = 'auto';
                        }
                        scrollToBottom();
                    });
                };

                // --- UI Utilities ---
                const scrollToBottom = () => {
                    nextTick(() => {
                        if (messagesContainer.value) {
                           messagesContainer.value.scrollTop = messagesContainer.value.scrollHeight;
                        }
                    });
                };

                const autoResize = (e) => {
                    e.target.style.height = 'auto';
                    e.target.style.height = e.target.scrollHeight + 'px';
                };

                const parseMarkdown = (text) => {
                    if(!text) return '';
                    // Simple link parser
                    return text.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" class="image-link">$1</a>');
                };

                const formatTime = (ts) => {
                    const date = new Date(ts);
                    return `${String(date.getHours()).padStart(2,'0')}:${String(date.getMinutes()).padStart(2,'0')}`;
                };
                
                const formatDividerDate = (ts) => {
                    const date = new Date(ts);
                    const now = new Date();
                    if (date.toDateString() === now.toDateString()) {
                        return formatTime(ts);
                    }
                    return `${date.getMonth()+1}-${date.getDate()} ${formatTime(ts)}`;
                };

                const showTimeDivider = (current, prev) => {
                    if (!prev) return true;
                    return (current.timestamp - prev.timestamp) > 5 * 60 * 1000;
                };

                const getImageSrc = (att) => {
                    if (att.url) return att.url;
                    if (att.data) return `data:image/png;base64,${att.data}`;
                    return '';
                };
                
                const openImage = (src) => window.open(src);

                onMounted(() => {
                    loadSavedToken();
                });

                return {
                    connected, socketConnected, authToken, rememberMe, errorMsg, hasSavedToken,
                    messages, inputText, messagesContainer, inputArea,
                    connect, disconnect, sendMessage, clearSavedToken,
                    autoResize, parseMarkdown, formatTime, showTimeDivider, formatDividerDate, 
                    getImageSrc, openImage
                };
            }
        });

        app.mount('#app');
    </script>
</body>
</html>
