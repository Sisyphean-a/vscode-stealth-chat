<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Stealth Chat</title>
    <!-- CSS -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="//unpkg.com/element-plus/dist/index.css" />
    
    <!-- Socket.io -->
    <script src="/socket.io/socket.io.js"></script>
    
    <!-- Vue 3 & Router & Element Plus (Global objects for simplicity when using ESM without import maps) -->
    <!-- We use Global Build for Vue/Element/Router to expose 'window.Vue' etc. 
         But we can also use ESM imports if using esm-browser versions.
         To mix best of both worlds (simplicity):
         Use Global scripts, but write our code as Modules.
    -->
    <script src="//unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="//unpkg.com/vue-router@4.3.0/dist/vue-router.global.js"></script>
    <script src="//unpkg.com/element-plus"></script>
    <script src="//unpkg.com/@element-plus/icons-vue"></script>
</head>
<body>
    <div id="app">
        <router-view></router-view>
    </div>

    <!-- Main Module -->
    <script type="module" src="js/app.js"></script>
</body>
</html>
