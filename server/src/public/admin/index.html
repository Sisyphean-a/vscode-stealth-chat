<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stealth Admin</title>
    <!-- Element Plus CSS -->
    <link rel="stylesheet" href="//unpkg.com/element-plus/dist/index.css" />
    <link rel="stylesheet" href="//unpkg.com/element-plus/theme-chalk/dark/css-vars.css" />
    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            background-color: #1a1a1a;
            color: #e0e0e0;
            font-family: 'Helvetica Neue', Helvetica, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', Arial, sans-serif;
        }
        #app {
            height: 100%;
        }
        .login-container {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .login-card {
            width: 400px;
            background: #252525;
            border: 1px solid #333;
        }
        .dashboard-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 20px;
            border-bottom: 1px solid #333;
        }
        .stat-card {
            background: #252525;
            color: #fff;
            border: 1px solid #333;
        }
        .app-table-card {
            margin-top: 20px;
            background: #252525;
            border: 1px solid #333;
        }
        /* Element Plus Dark Mode Overrides if needed */
        .el-table {
            --el-table-bg-color: #252525;
            --el-table-tr-bg-color: #252525;
            --el-table-header-bg-color: #2d2d2d;
            --el-table-border-color: #333;
            --el-table-text-color: #e0e0e0;
            --el-table-header-text-color: #aaa;
            --el-table-row-hover-bg-color: #333;
        }
        .el-dialog {
            background: #2d2d2d;
            --el-dialog-bg-color: #2d2d2d;
        }
        .el-input__wrapper {
            background-color: #1a1a1a;
            box-shadow: 0 0 0 1px #444 inset;
        }
    </style>
</head>
<body class="dark">
    <div id="app">
        <!-- Login View -->
        <div v-if="!token" class="login-container">
            <el-card class="login-card">
                <template #header>
                    <h2 style="margin:0; text-align: center;">Stealth Admin</h2>
                </template>
                <el-form @submit.prevent="login">
                    <el-form-item>
                        <el-input v-model="password" type="password" placeholder="Admin Password" show-password @keyup.enter="login"></el-input>
                    </el-form-item>
                    <el-button type="primary" style="width: 100%;" @click="login" :loading="loading">Login</el-button>
                </el-form>
                <div v-if="errorMsg" style="color: #f56c6c; margin-top: 10px; text-align: center;">
                    {{ errorMsg }}
                </div>
            </el-card>
        </div>

        <!-- Dashboard View -->
        <div v-else class="dashboard-container">
            <div class="header">
                <h1 style="margin:0;">Dashboard</h1>
                <el-button type="danger" size="small" @click="logout">Logout</el-button>
            </div>

            <!-- Stats -->
            <el-row :gutter="20">
                <el-col :span="8">
                    <el-card class="stat-card" shadow="hover">
                        <template #header>Running Time</template>
                        <div style="font-size: 24px;">{{ formatUptime(stats.uptime) }}</div>
                    </el-card>
                </el-col>
                <el-col :span="8">
                    <el-card class="stat-card" shadow="hover">
                        <template #header>Total Messages</template>
                        <div style="font-size: 24px;">{{ stats.totalMessages }}</div>
                    </el-card>
                </el-col>
                <el-col :span="8">
                    <el-card class="stat-card" shadow="hover">
                        <template #header>System</template>
                        <div style="color: #67c23a;">Healthy</div>
                    </el-card>
                </el-col>
            </el-row>

            <!-- App Management -->
            <el-card class="app-table-card" shadow="hover">
                <template #header>
                    <div style="display: flex; justify-content: space-between; align-items: center;">
                        <span>Applications</span>
                        <el-button type="primary" @click="openDialog()">Add App</el-button>
                    </div>
                </template>
                
                <el-table :data="stats.apps" style="width: 100%">
                    <el-table-column prop="id" label="ID" width="150"></el-table-column>
                    <el-table-column prop="name" label="Name"></el-table-column>
                    <el-table-column label="Token" width="200">
                        <template #default="scope">
                            <el-tag type="info" style="font-family: monospace;">{{ scope.row.token }}</el-tag>
                        </template>
                    </el-table-column>
                    <el-table-column label="Gotify" width="120">
                        <template #default="scope">
                            <el-tag :type="scope.row.gotifyToken ? 'success' : 'danger'">
                                {{ scope.row.gotifyToken ? 'Active' : 'Missing' }}
                            </el-tag>
                        </template>
                    </el-table-column>
                    <el-table-column label="Actions" width="180" align="right">
                        <template #default="scope">
                            <el-button size="small" @click="openDialog(scope.row)">Edit</el-button>
                            <el-popconfirm title="Are you sure to delete this app?" @confirm="deleteApp(scope.row.id)">
                                <template #reference>
                                    <el-button size="small" type="danger" :disabled="scope.row.id === 'default'">Del</el-button>
                                </template>
                            </el-popconfirm>
                        </template>
                    </el-table-column>
                </el-table>
            </el-card>
        </div>

        <!-- Edit/Add Dialog -->
        <el-dialog v-model="dialogVisible" :title="isEdit ? 'Edit App' : 'New App'" width="500px">
            <el-form :model="form" label-width="120px">
                <el-form-item label="App ID">
                    <el-input v-model="form.id" :disabled="isEdit" placeholder="e.g. secret_channel"></el-input>
                </el-form-item>
                <el-form-item label="Display Name">
                    <el-input v-model="form.name" placeholder="My Secret Channel"></el-input>
                </el-form-item>
                <el-form-item label="Chat Token">
                    <el-input v-model="form.token" placeholder="Password for phone login">
                         <template #append>
                            <el-button @click="generateToken">Gen</el-button>
                        </template>
                    </el-input>
                </el-form-item>
                <el-form-item label="Gotify Token">
                    <el-input v-model="form.gotifyToken" placeholder="From Gotify Admin"></el-input>
                </el-form-item>
            </el-form>
            <template #footer>
                <span class="dialog-footer">
                    <el-button @click="dialogVisible = false">Cancel</el-button>
                    <el-button type="primary" @click="submitForm">Confirm</el-button>
                </span>
            </template>
        </el-dialog>
    </div>

    <!-- Vue 3 -->
    <script src="//unpkg.com/vue@3/dist/vue.global.js"></script>
    <!-- Element Plus -->
    <script src="//unpkg.com/element-plus"></script>
    <!-- Icons -->
    <script src="//unpkg.com/@element-plus/icons-vue"></script>

    <script>
        const { createApp, ref, reactive, onMounted } = Vue;

        const app = createApp({
            setup() {
                const password = ref('');
                const token = ref(localStorage.getItem('admin_token') || '');
                const loading = ref(false);
                const errorMsg = ref('');
                const stats = reactive({ uptime: 0, totalMessages: 0, apps: [] });
                
                // Dialog
                const dialogVisible = ref(false);
                const isEdit = ref(false);
                const form = reactive({ id: '', name: '', token: '', gotifyToken: '' });

                const login = async () => {
                    loading.value = true;
                    try {
                        const res = await fetch('/api/admin/login', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ password: password.value })
                        });
                        const data = await res.json();
                        if (res.ok) {
                            token.value = data.token;
                            localStorage.setItem('admin_token', data.token);
                            errorMsg.value = '';
                            fetchStatus();
                        } else {
                            errorMsg.value = data.error || 'Login failed';
                        }
                    } catch (e) {
                        errorMsg.value = 'Network Error';
                    } finally {
                        loading.value = false;
                    }
                };

                const logout = () => {
                    token.value = '';
                    localStorage.removeItem('admin_token');
                };

                const fetchStatus = async () => {
                    if (!token.value) return;
                    try {
                        const res = await fetch('/api/admin/status', {
                            headers: { 'Authorization': `Bearer ${token.value}` }
                        });
                        if (res.status === 401 || res.status === 403) {
                            logout();
                            return;
                        }
                        const data = await res.json();
                        stats.uptime = data.uptime;
                        stats.totalMessages = data.totalMessages;
                        stats.apps = data.apps;
                    } catch (e) {
                        console.error(e);
                    }
                };

                const deleteApp = async (id) => {
                    await fetch(`/api/admin/apps/${id}`, {
                        method: 'DELETE',
                        headers: { 'Authorization': `Bearer ${token.value}` }
                    });
                    fetchStatus();
                };

                const openDialog = (row) => {
                    if (row) {
                        isEdit.value = true;
                        Object.assign(form, row);
                    } else {
                        isEdit.value = false;
                        form.id = '';
                        form.name = '';
                        form.token = '';
                        form.gotifyToken = '';
                    }
                    dialogVisible.value = true;
                };

                const submitForm = async () => {
                    const url = isEdit.value ? `/api/admin/apps/${form.id}` : '/api/admin/apps';
                    const method = isEdit.value ? 'PUT' : 'POST';
                    
                    await fetch(url, {
                        method: method,
                        headers: { 
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${token.value}` 
                        },
                        body: JSON.stringify(form)
                    });
                    
                    dialogVisible.value = false;
                    fetchStatus();
                };

                const generateToken = () => {
                    form.token = Math.random().toString(36).substring(2, 15) + Math.random().toString(36).substring(2, 15);
                }

                const formatUptime = (seconds) => {
                    const min = Math.floor(seconds / 60);
                    const hours = Math.floor(min / 60);
                    return `${hours}h ${min % 60}m`;
                };

                onMounted(() => {
                    if (token.value) {
                        fetchStatus();
                    }
                });

                return {
                    password, token, loading, errorMsg, stats,
                    login, logout, formatUptime, deleteApp,
                    dialogVisible, isEdit, form, openDialog, submitForm, generateToken
                };
            }
        });

        app.use(ElementPlus);
        app.mount('#app');
    </script>
</body>
</html>
